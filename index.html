<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robotics Bot | Premium Discord Music</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>

    <nav class="navbar">
        <div class="logo">MELODY<span>.</span></div>
        <div class="nav-links">
            <a href="#features">Features</a>
            <a href="#commands">Commands</a>
            <a href="#support">Support</a>
        </div>
        <button class="btn-login">Login</button>
    </nav>

    <section class="hero">
        <div class="hero-content">
            <span class="badge">v2.0 is now live!</span>
            <h1>Experience Music Like <span class="gradient-text">Never Before</span></h1>
            <p>High-fidelity audio, lag-free streaming, and advanced queue management for your Discord server.</p>
            <div class="hero-btns">
                <a href="#" class="btn-primary">Add to Discord</a>
                <a href="#" class="btn-secondary">View Dashboard</a>
            </div>
        </div>
        
        <div class="hero-visual">
            <div class="glass-card">
                <div class="playing-ui">
                    <div class="track-info">
                        <div class="track-img"></div>
                        <div class="track-text">
                            <div class="track-name">Now Playing: Moonlight</div>
                            <div class="track-author">Lo-fi Hip Hop</div>
                        </div>
                    </div>
                    <div class="progress-bar"><div class="fill"></div></div>
                </div>
            </div>
        </div>
    </section>

    <section class="stats">
        <div class="stat-item"><h2>500k+</h2><p>Servers</p></div>
        <div class="stat-item"><h2>2M+</h2><p>Users</p></div>
        <div class="stat-item"><h2>24/7</h2><p>Uptime</p></div>
    </section>

    <script src="script.js"></script>
</body>
</html>
