<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robotics Musica | Future of Audio</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;500;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #030305; --accent: #00f2ff; --purple: #7000ff; --glass: rgba(255, 255, 255, 0.03); --border: rgba(255, 255, 255, 0.08); --text: #ffffff; --text-dim: #a1a1aa; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg); color: var(--text); overflow-x: hidden; }
        .glow-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at 50% -10%, #1a1a3a 0%, transparent 40%); z-index: -1; }
        
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 20px 10%; background: rgba(0,0,0,0.7); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 1000; }
        .logo-area { display: flex; align-items: center; gap: 12px; }
        .nav-logo { width: 45px; height: 45px; border-radius: 50%; border: 2px solid var(--accent); }
        .nav-links a { text-decoration: none; color: var(--text-dim); margin-left: 20px; font-size: 0.9rem; transition: 0.3s; }
        .nav-links a:hover { color: var(--accent); }

        .hero { padding: 80px 10%; text-align: center; }
        .gradient-text { background: linear-gradient(90deg, var(--accent), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .btn-main { background: var(--accent); color: #000; text-decoration: none; padding: 18px 45px; border-radius: 14px; font-weight: 800; display: inline-block; transition: 0.3s; margin-top: 20px; }
        
        /* Future Audio Section */
        .future-audio { padding: 60px 10%; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; }
        .f-card { background: var(--glass); padding: 30px; border-radius: 20px; border: 1px solid var(--border); text-align: center; transition: 0.3s; }
        .f-card:hover { border-color: var(--accent); transform: translateY(-10px); }
        .f-card h3 { color: var(--accent); margin-bottom: 10px; }

        .main-img { width: 250px; height: 250px; border-radius: 50%; border: 4px solid var(--accent); margin: 40px auto; animation: float 6s infinite ease-in-out; display: block; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
    </style>
</head>
<body>
    <div class="glow-bg"></div>
    <nav class="navbar">
        <div class="logo-area">
            <img src="لێرە_لینکی_لۆگۆ_دابنێ" class="nav-logo">
            <div style="font-weight:800;">ROBOTICS <span style="color:var(--accent);">MUSICA</span></div>
        </div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="commands.html">Commands</a>
            <a href="https://discord.gg/RfeewVj3Fp">Support</a>
        </div>
    </nav>

    <section class="hero">
        <h1 style="font-size: 4rem;">Future <span class="gradient-text">Audio</span></h1>
        <p style="color:var(--text-dim); margin: 20px 0;">Robotics Musica provides the next level of sound experience.</p>
        <img src="لێرە_لینکی_لۆگۆ_دابنێ" class="main-img">
        <a href="https://discord.com/oauth2/authorize?client_id=1150754451938869371&permissions=8&integration_type=0&scope=bot" class="btn-main">Invite Now</a>
    </section>

    <section class="future-audio">
        <div class="f-card"><h3>24/7</h3><p>Always online, never stops.</p></div>
        <div class="f-card"><h3>Uptime</h3><p>99.9% robotic stability.</p></div>
        <div class="f-card"><h3>Premium</h3><p>All commands are free.</p></div>
        <div class="f-card"><h3>HQ Sound</h3><p>320kbps Crystal Clear.</p></div>
    </section>
</body>
</html>
